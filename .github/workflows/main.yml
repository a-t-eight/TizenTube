name: Build TizenTube Standalone App2Samsung Unsigned and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine release tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build service for DIAL
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npx rollup -c rollup.config.js

      - name: Build standalone service
        working-directory: standalone/service
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf node_modules

      # This is intentionally unsigned. Apps2Samsung will provision/reuse its
      # certificates and add fresh author and distributor signatures at install time.
      - name: Package unsigned WGT for Apps2Samsung
        working-directory: standalone
        run: |
          mkdir -p release
          zip -r -9 release/TizenTube.wgt \
            config.xml \
            icon.png \
            icon_16b9.png \
            index.html \
            service \
            -x 'service/node_modules/*' \
               'author-signature.xml' \
               'signature1.xml'

      - name: Verify unsigned WGT
        run: |
          WGT="standalone/release/TizenTube.wgt"
          ENTRIES="${RUNNER_TEMP}/tizentube-wgt-entries.txt"

          unzip -t "$WGT"
          unzip -Z1 "$WGT" > "$ENTRIES"

          grep -qx 'config.xml' "$ENTRIES"
          grep -qx 'icon.png' "$ENTRIES"
          grep -qx 'icon_16b9.png' "$ENTRIES"
          grep -qx 'index.html' "$ENTRIES"
          grep -qx 'service/dist/index.js' "$ENTRIES"

          if grep -Eq '(^|/)(author-signature\.xml|signature1\.xml)$' "$ENTRIES"; then
            echo "Unexpected signature file found in unsigned WGT" >&2
            exit 1
          fi

      - name: Upload unsigned WGT artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenTube-${{ env.RELEASE_VERSION }}-unsigned-for-Apps2Samsung
          path: standalone/release/TizenTube.wgt
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            This TizenTube WGT is intentionally unsigned.

            Install it through Apps2Samsung, which will apply the required
            Samsung author and distributor signatures before installation.
          files: standalone/release/TizenTube.wgt
